# Docker Compose for integration tests.
# Runs Dgraph zero + alpha. Host ports are offset (+100) to avoid conflicts with dev instance.
# Inside the containers, Dgraph uses its default ports (no --port_offset).
# Usage:
#   docker compose -f docker-compose.test.yml up -d --wait
#   docker compose -f docker-compose.test.yml down -v --remove-orphans

services:
  zero-test:
    image: dgraph/dgraph:v22.0.2
    command: dgraph zero --my=zero-test:5080
    ports:
      - "5180:5080"
      - "6180:6080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  alpha-test:
    image: dgraph/dgraph:v22.0.2
    command: >
      dgraph alpha
        --my=alpha-test:7080
        --zero=zero-test:5080
        --security=whitelist=0.0.0.0/0
        --limit=mutations=strict
        --graphql=introspection=true
    ports:
      - "8180:8080"
      - "9180:9080"
    depends_on:
      zero-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-test:
    image: redis:7-alpine
    ports:
      - "6479:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # S3-compatible object store for /file/* integration tests. MinIO is API-compatible
  # with Garage (the production backend), so internal/storage/s3.go behaves identically.
  minio-test:
    image: minio/minio:latest
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9101"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
