[server]
instance_name = "Fractale"
domain = "YOUR_DOMAIN"
hostname = "localhost"
port = "8888"
jwt_secret = "my_jwt_secret"
prometheus_instrumentation = false
prometheus_credentials = "my_prom_secret"
client_version = "git hash used to build the client"

[mailer]
admin_email = "admin@mydomain.com"
# URL API
email_api_url = "https://..."
email_api_key = "..."
# SMTP API
# ...TODO...
# Postal validation creds
# postal default-dkim-record: Just the p=... part of the TXT record (without the semicolon at the end)
dkim_key = "..."
# webhook redirection for Postal alert.
matrix_domain = "matrix.org"
matrix_postal_room = "!...:matrix.org"
matrix_token = "..."

[db]
hostname = "localhost"
port_graphql = "8080"
port_grpc = "9080"
api = "graphql"
admin = "admin"
dgraph_public_key = "public.pem"
dgraph_private_key = "private.pem"

[graphql]
complexity_limit = 200 # 50
introspection = false

[admin]
max_public_orgas = -1    # Maximum public organnization per user, -1 for unlimited
max_private_orgas = -1   # Maximum private organnization per user, -1 for unlimited
max_orga_reg = -1        # Maximum organnization per regular user, -1 for unlimited
max_orga_pro = -1        # Maximum organnization per pro user, -1 for unlimited

[storage]
# S3-compatible object store for file assets — comment attachments, user avatars,
# org avatars (Garage in production, MinIO compatible). Leave endpoint empty to
# disable upload features. See docs/file-storage.md.
#
# A single bucket holds all file kinds, namespaced by key prefix:
#   orgas/<rootnameid>/tensions/<tid>/<cid>/<rand>-<safe-name>  comment attachments
#   orgas/<rootnameid>/<rand>-<safe-name>                       org avatars
#   users/<username>/<rand>-<safe-name>                         user avatars
endpoint           = ""                  # e.g. "garage.YOUR_DOMAIN" (host[:port], no scheme)
region             = "garage"            # Garage default; MinIO commonly uses "us-east-1"
bucket             = "fractale-storage"
access_key         = "..."
secret_key         = "..."
use_ssl            = true                # require HTTPS when storage is on another host
public_url_prefix  = ""                  # optional; e.g. "https://files.YOUR_DOMAIN" to rewrite presigned host
max_upload_bytes   = 10485760            # 10 MiB
presign_ttl_sec    = 600                 # presigned URL TTL, seconds (10 min)
