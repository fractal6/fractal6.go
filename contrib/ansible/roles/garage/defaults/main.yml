---
# defaults/main.yml — overridable variables for the garage role.
# Every value below can be overridden in inventory/group_vars/host_vars.
# Secrets (rpc_secret, admin_token, metrics_token) MUST be supplied via
# Ansible Vault — defaults intentionally have no value.

# ---- version & download ----------------------------------------------------

# Pinned upstream release. Bump deliberately and refresh the sha256 below.
# Verify the latest stable on https://garagehq.deuxfleurs.fr/download/.
garage_version: "v2.1.0"

# Source URL template. Garage publishes static binaries on its own CDN.
garage_download_url: "https://garagehq.deuxfleurs.fr/_releases/{{ garage_version }}/x86_64-unknown-linux-musl/garage"

# Sha256 of the binary at the URL above (x86_64-musl).
# Verify against https://garagehq.deuxfleurs.fr/_releases/{{ garage_version }}/x86_64-unknown-linux-musl/garage.sha256
garage_download_sha256: ""

# Where the binary lands.
garage_install_path: "/usr/local/bin/garage"

# ---- system layout ---------------------------------------------------------

garage_user:           "garage"
garage_group:          "garage"
garage_config_dir:     "/etc/garage"
garage_data_dir:       "/var/lib/garage/data"     # bulk object data (large, fast disk if possible)
garage_metadata_dir:   "/var/lib/garage/meta"     # metadata (small, MUST be on fast SSD)
garage_log_dir:        "/var/log/garage"

# ---- network endpoints -----------------------------------------------------

# RPC listener (cluster gossip + replication). Single-node = bind to localhost.
# For multi-node, expose on a private network and put the secret on every node.
garage_rpc_bind_addr:    "[::]:3901"
garage_rpc_public_addr:  "127.0.0.1:3901"

# S3 API — bind to localhost; an HTTPS reverse proxy in front handles TLS and
# exposes the public hostname.
garage_s3_bind_addr:     "[::1]:3900"
garage_s3_public_host:   "garage.example.com"   # used for the S3 v4 signing host header
garage_s3_root_domain:   ".s3.example.com"      # vhost-style addressing (optional)

# Admin API (cluster ops, key management). Localhost-only by default.
garage_admin_bind_addr:  "[::1]:3903"

# K2V API (key/value layer). Disabled by default — Fractale only needs S3.
garage_k2v_enabled:      false
garage_k2v_bind_addr:    "[::1]:3904"

# ---- storage tuning --------------------------------------------------------

# Replication factor (integer). 1 = single-node, no replication. Use 3 for an
# HA 3-node cluster. NOTE: pre-v0.10 used the string `replication_mode = "none"`;
# v0.10+ uses an integer `replication_factor`. We target v2.x.
garage_replication_factor: 1

# Read/write consistency. "consistent" is the default and recommended value.
# "degraded"  → reads can be served from any single replica (faster, weaker).
# "dangerous" → writes need only one replica to ack (lossy on failure).
# Required key in v2.x.
garage_consistency_mode: "consistent"

# DB engine for metadata. "lmdb" is the default since v0.9.0 and recommended.
# Other options: "sqlite", "fjall" (experimental, v1.3+/v2.1+).
garage_db_engine: "lmdb"

# Data block size. Garage accepts human-readable sizes ("1M", "4M", "1MiB"…).
# Default upstream is "1M".
garage_block_size:       "1M"

# Compression level for blocks (-99..22; 1 = fast; "none" disables).
garage_compression_level: 1

# Periodic snapshot of metadata for crash safety. Empty string disables.
garage_metadata_auto_snapshot_interval: "6h"

# ---- security (REQUIRED — provide via Vault) ------------------------------

# 32-byte hex string. Generate: openssl rand -hex 32
garage_rpc_secret:     ""
# Admin API token. Generate: openssl rand -hex 32
garage_admin_token:    ""
# /metrics endpoint token. Generate: openssl rand -hex 32
garage_metrics_token:  ""

# ---- bootstrap (single-node convenience) ----------------------------------

# When true, after the service is up:
#   - assign the local node to the cluster layout (single-node)
#   - create the bucket below if missing
#   - create an S3 access key with full RW on the bucket
#   - write {access_key, secret_key} to /etc/garage/bootstrap-result.yml
# Idempotent: skips steps that have already been done.
garage_bootstrap_cluster: true
garage_bootstrap_bucket:  true
garage_bucket_name:       "fractale-storage"
garage_bucket_zone:       "dc1"
garage_bucket_capacity:   "100G"   # advisory layout capacity for this node
