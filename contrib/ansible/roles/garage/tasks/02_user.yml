---
# System user + directory layout. Garage drops privileges to this UID at start.

- name: Ensure garage group
  ansible.builtin.group:
    name: "{{ garage_group }}"
    system: true
    state: present

- name: Ensure garage user
  ansible.builtin.user:
    name: "{{ garage_user }}"
    group: "{{ garage_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ garage_metadata_dir }}"
    create_home: false
    state: present

- name: Create directory layout
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(garage_user) }}"
    group: "{{ item.group | default(garage_group) }}"
    mode:  "{{ item.mode  | default('0750') }}"
  loop:
    - { path: "{{ garage_config_dir }}",   owner: root, group: "{{ garage_group }}", mode: "0750" }
    - { path: "{{ garage_data_dir }}" }
    - { path: "{{ garage_metadata_dir }}" }
    - { path: "{{ garage_log_dir }}" }
