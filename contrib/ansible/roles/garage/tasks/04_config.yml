---
# Render /etc/garage/garage.toml. Mode 0640 root:garage so the daemon can read
# but other users on the box cannot pull the RPC secret.

- name: Render garage.toml
  ansible.builtin.template:
    src: garage.toml.j2
    dest: "{{ garage_config_dir }}/garage.toml"
    owner: root
    group: "{{ garage_group }}"
    mode: "0640"
  notify: Restart garage
