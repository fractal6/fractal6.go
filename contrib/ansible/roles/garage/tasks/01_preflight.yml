---
# Preflight: bail loudly if a required secret is missing or obviously bad.
# These are cheap checks that prevent painful debugging on first deploy.

- name: Required secrets are set
  ansible.builtin.assert:
    that:
      - garage_rpc_secret    | length >= 32
      - garage_admin_token   | length >= 16
      - garage_metrics_token | length >= 16
    fail_msg: >
      garage_rpc_secret (>=32 chars), garage_admin_token (>=16) and
      garage_metrics_token (>=16) MUST be supplied via Vault. Generate with
      `openssl rand -hex 32`.

- name: Pinned binary checksum is set
  ansible.builtin.assert:
    that:
      - garage_download_sha256 | length == 64
    fail_msg: >
      garage_download_sha256 must be the 64-hex-char sha256 of the binary at
      garage_download_url. Refusing to install an unverified binary.
