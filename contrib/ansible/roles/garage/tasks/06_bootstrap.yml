---
# Single-node convenience bootstrap. Idempotent: every step probes existing
# state via `garage` CLI and skips work that's already done.
#
# This intentionally uses the CLI (not the admin HTTP API) because the CLI
# embeds its own credentials via /etc/garage/garage.toml, avoiding the
# chicken-and-egg of needing an admin token in shell variables.

- name: Read current cluster status
  ansible.builtin.command: "{{ garage_install_path }} status"
  register: garage_status
  changed_when: false
  failed_when: false

- name: Resolve local node id
  ansible.builtin.shell: |
    set -o pipefail
    {{ garage_install_path }} node id -q | cut -d'@' -f1
  args:
    executable: /bin/bash
  register: garage_node_id
  changed_when: false

# --- cluster layout (single-node) -----------------------------------------

- name: Assign local node to layout (single-node bootstrap)
  ansible.builtin.command: >-
    {{ garage_install_path }} layout assign
      -z {{ garage_bucket_zone }}
      -c {{ garage_bucket_capacity }}
      -t {{ inventory_hostname_short }}
      {{ garage_node_id.stdout }}
  when:
    - garage_bootstrap_cluster
    - garage_node_id.stdout not in garage_status.stdout
  register: garage_layout_assign
  changed_when: garage_layout_assign.rc == 0

- name: Apply layout
  ansible.builtin.command: "{{ garage_install_path }} layout apply --version 1"
  when: garage_layout_assign is changed
  register: garage_layout_apply
  changed_when: garage_layout_apply.rc == 0
  failed_when:
    - garage_layout_apply.rc != 0
    - "'no changes' not in (garage_layout_apply.stderr | default(''))"

# --- bucket --------------------------------------------------------------

- name: List existing buckets
  ansible.builtin.command: "{{ garage_install_path }} bucket list"
  register: garage_buckets
  changed_when: false
  when: garage_bootstrap_bucket

- name: Create application bucket
  ansible.builtin.command: "{{ garage_install_path }} bucket create {{ garage_bucket_name }}"
  when:
    - garage_bootstrap_bucket
    - garage_bucket_name not in garage_buckets.stdout

# --- access key ----------------------------------------------------------
# Re-running the role does NOT rotate the key. The bootstrap result file
# (created once) is the source of truth — delete it manually to force a
# rotation, then re-run.

- name: Stat bootstrap-result file
  ansible.builtin.stat:
    path: "{{ garage_config_dir }}/bootstrap-result.yml"
  register: garage_bootstrap_result_stat
  when: garage_bootstrap_bucket

- name: Create S3 access key for the bucket
  ansible.builtin.command: >-
    {{ garage_install_path }} key create {{ garage_bucket_name }}-app
  register: garage_key_create
  when:
    - garage_bootstrap_bucket
    - not garage_bootstrap_result_stat.stat.exists
  changed_when: garage_key_create.rc == 0

- name: Grant the key RW on the bucket
  ansible.builtin.command: >-
    {{ garage_install_path }} bucket allow
      --read --write --owner {{ garage_bucket_name }}
      --key {{ garage_bucket_name }}-app
  when: garage_key_create is changed

- name: Resolve the new key's secret (only on creation)
  ansible.builtin.command: "{{ garage_install_path }} key info {{ garage_bucket_name }}-app --show-secret"
  register: garage_key_info
  when: garage_key_create is changed
  changed_when: false
  no_log: true

- name: Persist bootstrap result (one-time)
  ansible.builtin.copy:
    dest: "{{ garage_config_dir }}/bootstrap-result.yml"
    owner: root
    group: root
    mode: "0600"
    content: |
      # Created by the garage Ansible role on initial bootstrap.
      # Treat as a secret. Read with: ansible <host> -b -m slurp ...
      bucket:     "{{ garage_bucket_name }}"
      access_key: "{{ garage_key_info.stdout | regex_search('Key ID:\\s*(\\S+)', '\\1') | first }}"
      secret_key: "{{ garage_key_info.stdout | regex_search('Secret key:\\s*(\\S+)', '\\1') | first }}"
  when: garage_key_create is changed
  no_log: true
